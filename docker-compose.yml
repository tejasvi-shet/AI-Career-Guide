version: "3.8"

services:

  backend:

    build: ./backend

    container_name: ai_backend

    ports:

      - "8000:8000"

    env_file:

      - ./backend/.env

    restart: always


  frontend:

    build: ./frontend

    container_name: ai_frontend

    ports:

      - "5173:5173"

    depends_on:

      - backend

    restart: always